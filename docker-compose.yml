# Siloquy: Discord stats channels for Silo.
#
#   cp .env.example .env    # fill in your settings
#   docker compose up -d --build
#
# Publishes no ports: nothing can connect *to* this container.
# Saltbox users: see compose.saltbox.yml (enabled with one line in .env).

services:
  siloquy:
    build: .
    image: siloquy:local
    container_name: siloquy
    restart: unless-stopped
    env_file: .env
    environment:
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      SILO_API_KEY_FILE: /run/secrets/silo_api_key
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?Set DISCORD_GUILD_ID in .env}
      SILO_URL: ${SILO_URL:?Set SILO_URL in .env}
    # Lets SILO_URL=http://host.docker.internal:<port> reach a Silo whose port
    # is published on this same machine (Linux needs this line; harmless elsewhere).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - discord_token
      - silo_api_key
    volumes:
      - ./data:/data
    # --- hardening ---
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

secrets:
  discord_token:
    file: ./secrets/discord_token
  silo_api_key:
    file: ./secrets/silo_api_key
